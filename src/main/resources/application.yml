server:
  port: 8080

spring:
  application:
    name: "auth-guard"
  datasource:
    hikari:
      auto-commit: true
      minimum-idle: 5
      maximum-pool-size: 10
      connection-timeout: 1000
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    open-in-view: false
  cache:
    type: simple

springdoc:
  api-docs:
    path: "/v3/api-docs"

management:
  endpoints:
    web:
      exposure:
        include: health